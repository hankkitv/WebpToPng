<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebP to PNG Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    #drop-area {
      border: 3px dashed #888;
      padding: 40px;
      margin: auto;
      width: 300px;
      cursor: pointer;
      color: #444;
    }
  </style>
</head>
<body>

<h2>Drag & Drop WebP to Convert to PNG</h2>
<div id="drop-area">Drop your .webp file here</div>

<script>
document.getElementById("drop-area").addEventListener("dragover", function(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
});

document.getElementById("drop-area").addEventListener("drop", function(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file || !file.name.toLowerCase().endsWith(".webp")) {
    alert("Please drop a valid .webp file.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(event) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(function(blob) {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = file.name.replace(/\.webp$/i, ".png");
        link.click();
      }, "image/png");
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
